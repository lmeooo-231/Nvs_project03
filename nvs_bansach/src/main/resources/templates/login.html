<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | NVS Bán Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="login-container bg-white">
        <h2 class="text-center text-primary mb-4">Đăng Nhập</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div id="loginMessage" class="alert d-none" role="alert"></div>

            <button type="submit" class="btn btn-primary w-100 mb-3">Đăng nhập</button>
            <p class="text-center">Chưa có tài khoản? <a href="/register">Đăng ký ngay</a></p>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('loginMessage');

        messageDiv.classList.add('d-none');
        messageDiv.classList.remove('alert-success', 'alert-danger');

        try {
            const response = await fetch('/api/auth/authenticate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Đăng nhập thành công
                messageDiv.textContent = 'Đăng nhập thành công! Đang chuyển hướng...';
                messageDiv.classList.add('alert-success');
                messageDiv.classList.remove('d-none');

                // Lưu JWT token vào Local Storage (QUAN TRỌNG)
                localStorage.setItem('jwt_token', data.token);

                // Chuyển hướng người dùng về trang chủ hoặc profile
                setTimeout(() => {
                    window.location.href = '/profile';
                }, 1000);

            } else {
                // Đăng nhập thất bại (Ví dụ: 403 Forbidden hoặc 401 Unauthorized)
                messageDiv.textContent = data.message || 'Email hoặc mật khẩu không đúng.';
                messageDiv.classList.add('alert-danger');
                messageDiv.classList.remove('d-none');
            }
        } catch (error) {
            messageDiv.textContent = 'Lỗi kết nối server.';
            messageDiv.classList.add('alert-danger');
            messageDiv.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
