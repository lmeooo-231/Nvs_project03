<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid my-5">
    <div class="row">
        <div class="col-md-3">
            <div class="list-group">
                <a href="/admin/dashboard" class="list-group-item list-group-item-action">Dashboard</a>
                <a href="/admin/products" class="list-group-item list-group-item-action active">Quản lý Sản phẩm</a>
                <a href="/admin/orders" class="list-group-item list-group-item-action">Quản lý Đơn hàng</a>
                <a href="/logout" class="list-group-item list-group-item-action text-danger">Đăng xuất</a>
            </div>
        </div>

        <div class="col-md-9">
            <h1 class="text-primary mb-4">Quản lý Sản phẩm</h1>
            <button class="btn btn-success mb-3">Thêm Sản phẩm Mới</button>
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tên Sách</th>
                        <th>Tác giả</th>
                        <th>Giá</th>
                        <th>Kho</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>1</td>
                        <td>Tên Sách Lập Trình</td>
                        <td>Nguyễn Văn A</td>
                        <td>150,000</td>
                        <td>50</td>
                        <td>
                            <button class="btn btn-sm btn-info me-2">Sửa</button>
                            <button class="btn btn-sm btn-danger">Xóa</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Sách Kinh Doanh</td>
                        <td>Trần Thị B</td>
                        <td>220,000</td>
                        <td>15</td>
                        <td>
                            <button class="btn btn-sm btn-info me-2">Sửa</button>
                            <button class="btn btn-sm btn-danger">Xóa</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
