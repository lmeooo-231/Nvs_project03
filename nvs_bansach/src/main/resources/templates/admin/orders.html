<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid my-5">
    <div class="row">
        <div class="col-md-3">
            <div class="list-group">
                <a href="/admin/dashboard" class="list-group-item list-group-item-action">Dashboard</a>
                <a href="/admin/products" class="list-group-item list-group-item-action">Quản lý Sản phẩm</a>
                <a href="/admin/orders" class="list-group-item list-group-item-action active">Quản lý Đơn hàng</a>
                <a href="/logout" class="list-group-item list-group-item-action text-danger">Đăng xuất</a>
            </div>
        </div>

        <div class="col-md-9">
            <h1 class="text-warning mb-4">Quản lý Đơn hàng</h1>
            <div class="mb-3">
                <select class="form-select w-25 d-inline-block">
                    <option selected>Lọc theo trạng thái</option>
                    <option>Chờ xử lý</option>
                    <option>Đang giao</option>
                    <option>Đã hủy</option>
                </select>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>Mã ĐH</th>
                        <th>Khách hàng</th>
                        <th>Ngày đặt</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td>#NVS1001</td>
                        <td>Nguyễn Văn Test</td>
                        <td>2025-12-15</td>
                        <td>550,000</td>
                        <td><span class="badge bg-warning text-dark">Chờ xử lý</span></td>
                        <td><button class="btn btn-sm btn-primary">Chi tiết</button></td>
                    </tr>
                    <tr>
                        <td>#NVS1002</td>
                        <td>Trần Thị A</td>
                        <td>2025-12-14</td>
                        <td>320,000</td>
                        <td><span class="badge bg-success">Đã giao</span></td>
                        <td><button class="btn btn-sm btn-primary">Chi tiết</button></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
