<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân | NVS Bán Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .list-group-item-action:hover {
            cursor: pointer;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">NVS Bán Sách</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="/profile">Profile</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="mb-4">Thông Tin Tài Khoản</h1>

    <div class="row">

        <div class="col-md-3">
            <div class="list-group" id="profile-tabs">
                <a href="#info" class="list-group-item list-group-item-action active" data-bs-toggle="list">
                    Thông tin Cá nhân
                </a>
                <a href="#orders" class="list-group-item list-group-item-action" data-bs-toggle="list">
                    Lịch sử Đơn hàng
                </a>
                <a href="#password" class="list-group-item list-group-item-action" data-bs-toggle="list">
                    Đổi Mật khẩu
                </a>
                <a href="#" id="logout-link" class="list-group-item list-group-item-action text-danger">
                    Đăng xuất
                </a>
            </div>
        </div>

        <div class="col-md-9">
            <div class="tab-content">

                <div class="tab-pane fade show active" id="info">
                    <h2>Cập nhật Thông tin</h2>
                    <hr>
                    <form id="updateInfoForm">
                        <div id="infoMessage" class="alert d-none" role="alert"></div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email (Không đổi)</label>
                            <input type="email" class="form-control" id="email" disabled>
                        </div>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Họ và Tên</label>
                            <input type="text" class="form-control" id="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" id="phone">
                        </div>
                        <button type="submit" class="btn btn-primary">Lưu Thay Đổi</button>
                    </form>
                </div>

                <div class="tab-pane fade" id="orders">
                    <h2>Lịch sử Đơn hàng</h2>
                    <hr>
                    <div id="orders-list">
                        <div class="alert alert-info">Đang tải lịch sử đơn hàng...</div>
                    </div>
                </div>

                <div class="tab-pane fade" id="password">
                    <h2>Đổi Mật khẩu</h2>
                    <hr>
                    <form id="changePasswordForm" style="max-width: 400px;">
                        <div id="passwordMessage" class="alert d-none" role="alert"></div>
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Mật khẩu Hiện tại</label>
                            <input type="password" class="form-control" id="currentPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Mật khẩu Mới</label>
                            <input type="password" class="form-control" id="newPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Xác nhận Mật khẩu Mới</label>
                            <input type="password" class="form-control" id="confirmPassword" required>
                        </div>
                        <button type="submit" class="btn btn-danger">Đổi Mật khẩu</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>

<footer class="bg-light text-center py-3 mt-5">
    <p>&copy; 2025 NVS Bán Sách.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Khởi tạo tab mặc định
        var infoTab = document.querySelector('a[href="#info"]');
        if (infoTab) {
            new bootstrap.Tab(infoTab).show();
        }

        // Tải dữ liệu profile khi trang load
        loadUserProfile();

        // 🚨 Xử lý ĐĂNG XUẤT
        document.getElementById('logout-link').addEventListener('click', function(event) {
            event.preventDefault();
            localStorage.removeItem('jwt_token'); // Xóa token
            window.location.href = '/login';     // Chuyển hướng về trang đăng nhập
        });

        // 🚨 Xử lý CẬP NHẬT THÔNG TIN (API cần được tạo sau)
        document.getElementById('updateInfoForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Chức năng Cập nhật thông tin chưa được triển khai API.');
            // Logic gọi API PUT /api/users/profile sẽ được thêm tại đây
        });

        // 🚨 Xử lý ĐỔI MẬT KHẨU (API cần được tạo sau)
        document.getElementById('changePasswordForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Chức năng Đổi mật khẩu chưa được triển khai API.');
            // Logic gọi API POST /api/users/change-password sẽ được thêm tại đây
        });
    });

    /**
     * Hàm tải thông tin Profile từ Backend API
     */
    async function loadUserProfile() {
        const token = localStorage.getItem('jwt_token');
        const infoMessageDiv = document.getElementById('infoMessage');

        if (!token) {
            alert("Vui lòng đăng nhập lại để truy cập trang cá nhân.");
            window.location.href = '/login';
            return;
        }

        try {
            const response = await fetch('/api/users/profile', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` // Gửi Token JWT
                }
            });

            if (response.ok) {
                const userData = await response.json();

                // Cập nhật form với dữ liệu thực tế
                document.getElementById('email').value = userData.email || '';
                document.getElementById('fullName').value = userData.fullName || '';
                document.getElementById('phone').value = userData.phone || '';

                infoMessageDiv.classList.add('d-none'); // Ẩn thông báo lỗi nếu có

            } else if (response.status === 401 || response.status === 403) {
                // Token không hợp lệ/hết hạn
                alert("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.");
                localStorage.removeItem('jwt_token');
                window.location.href = '/login';
            } else {
                // Lỗi khác từ server
                infoMessageDiv.textContent = `Lỗi tải dữ liệu: ${response.statusText}`;
                infoMessageDiv.classList.add('alert-danger');
                infoMessageDiv.classList.remove('d-none');
            }
        } catch (error) {
            console.error("Lỗi kết nối API:", error);
            infoMessageDiv.textContent = 'Lỗi kết nối server khi tải thông tin.';
            infoMessageDiv.classList.add('alert-danger');
            infoMessageDiv.classList.remove('d-none');
        }
    }
</script>
</body>
</html>
