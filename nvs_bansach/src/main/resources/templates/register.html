<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | NVS Bán Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .register-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="register-container bg-white">
        <h2 class="text-center text-success mb-4">Tạo Tài Khoản Mới</h2>
        <form id="registerForm">
            <div class="mb-3">
                <label for="fullName" class="form-label">Họ và Tên</label>
                <input type="text" class="form-control" id="fullName" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div id="registerMessage" class="alert d-none" role="alert"></div>

            <button type="submit" class="btn btn-success w-100 mb-3">Đăng ký</button>
            <p class="text-center">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('registerMessage');

        messageDiv.classList.add('d-none');
        messageDiv.classList.remove('alert-success', 'alert-danger');

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ fullName, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Đăng ký thành công
                messageDiv.textContent = 'Đăng ký thành công! Vui lòng Đăng nhập.';
                messageDiv.classList.add('alert-success');
                messageDiv.classList.remove('d-none');

                // Tùy chọn: Chuyển hướng người dùng đến trang đăng nhập
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                // Đăng ký thất bại (Ví dụ: Email đã tồn tại)
                messageDiv.textContent = data.message || 'Đăng ký thất bại. Vui lòng thử lại.';
                messageDiv.classList.add('alert-danger');
                messageDiv.classList.remove('d-none');
            }
        } catch (error) {
            messageDiv.textContent = 'Lỗi kết nối server.';
            messageDiv.classList.add('alert-danger');
            messageDiv.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
